<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiroyasu IC-980 Pro FIX12 — 240-bit CPS Channel Map - YSF & CSV Editor by Ranke YU6RDR (CPS columns)</title>
<style>
:root {
  --bg: #12151c; --card: #1c212c; --bd: #2e3646; --fg: #e2e8f0; --mut: #94a3b8;
  --ac: #2563eb; --ac-h: #1d4ed8; --sel: #1e293b; --warn: #ef4444; --succ: #22c55e;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 Arial, sans-serif; }
h1 { font-size: 20px; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, input[type="file"]::file-selector-button {
  background: var(--ac); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px;
  font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.15s;
}
button:hover { background: var(--ac-h); }
button.o { background: transparent; color: var(--mut); border: 1px solid var(--bd); }
button.o:hover { background: var(--bd); color: #fff; }
button.danger { background: var(--warn); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.file-input { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--bd); padding: 6px 10px; border-radius: 6px; }
#wrap { max-height: 65vh; overflow: auto; border: 1px solid var(--bd); border-radius: 6px; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--bd); white-space: nowrap; }
th { position: sticky; top: 0; background: #252d3d; z-index: 2; font-size: 12px; }
th small { display: block; color: var(--mut); font-weight: normal; }
tr.r { cursor: pointer; }
tr.r:hover { background: #232b3b; }
tr.sel { background: var(--sel) !important; border-left: 3px solid var(--ac); }
input[type="text"], input[type="number"], input[type="search"], select {
  background: #11141a; border: 1px solid var(--bd); color: var(--fg); padding: 4px 6px; border-radius: 4px; font-size: 12px;
}
select:disabled { opacity: 0.35; }
input.nm { width: 150px; } input.fq { width: 105px; } input.of { width: 80px; }
.msg { margin-top: 8px; font-size: 13px; font-weight: bold; }
.err { color: var(--warn); }
.succ { color: var(--succ); }
.hint { color: var(--mut); font-size: 12px; margin-top: 6px; font-weight: normal; }
.der { color: var(--mut); }

th.gs, td.gs { border-left: 3px solid var(--ac); }
input.cm { width: 120px; }

th.gs, td.gs { border-left: 3px solid var(--ac); }
input.cm { width: 120px; }
tr.r.sel { background: #1e3a5f !important; box-shadow: inset 3px 0 0 var(--ac); }
tr.r td:first-child { user-select: none; cursor: default; }
#ctx { position: fixed; z-index: 60; background: #232b3b; border: 1px solid var(--bd); border-radius: 6px; padding: 4px 0; min-width: 270px; box-shadow: 0 8px 24px #000a; font-size: 13px; }
#ctx[hidden], .modal[hidden] { display: none; }
.mi { position: relative; display: flex; justify-content: space-between; gap: 22px; padding: 6px 14px; cursor: pointer; }
.mi:hover { background: var(--ac); }
.mi small { color: var(--mut); } .mi:hover small { color: #dbeafe; }
.mi.dis { opacity: .4; cursor: default; } .mi.dis:hover { background: none; }
.msep { height: 1px; background: var(--bd); margin: 4px 0; }
.submenu { display: none; position: absolute; left: 100%; top: -5px; background: #232b3b; border: 1px solid var(--bd); border-radius: 6px; padding: 4px 0; min-width: 250px; box-shadow: 0 8px 24px #000a; }
.mi.has:hover > .submenu { display: block; } .mi.dis > .submenu { display: none !important; }
#ctx.left .submenu { left: auto; right: 100%; }
.modal { position: fixed; inset: 0; background: #000a; z-index: 70; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.mbox { background: var(--card); border: 1px solid var(--bd); border-radius: 8px; width: min(980px, 100%); padding: 16px; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: bold; font-size: 15px; }
.props { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 14px; }
.props label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mut); }
.props input, .props select { width: 100% !important; }

.ho { display: inline-block; width: 30px; color: var(--mut); }
.hb { display: inline-block; width: 26px; text-align: center; border-radius: 3px; }
.hb.z { color: #4b5565; } .hb.k { background: #1e3a5f; color: #fff; } .hb.d { background: var(--warn) !important; color: #fff; }

  grid-template-columns: 20px 100px 95px !important;
  align-items: center;

}

<h1>Hiroyasu IC-980 Pro - YSF & CSV Editor by Ranke YU6RDR</h1>

<div class="card">
  <div class="btn-group">
    <label class="fbtn" for="fYsf">Load .Ysf…</label>
    <input type="file" id="fYsf" accept=".ysf,.Ysf" class="hid">
    <label class="fbtn" for="fCsv">Import CSV…</label>
    <input type="file" id="fCsv" accept=".csv" class="hid">
    <button id="bNew" class="o">Create Empty List</button>
  </div>
  <div class="msg" id="info">Select a .Ysf or .CSV file to get started.</div>
</div>

<div class="card">
  <div class="btn-group">
    <button id="bInsEmpty" disabled>+ Insert Empty Channel Here</button>
    <button id="bUp" class="o" disabled>▲ Move Up</button>
    <button id="bDn" class="o" disabled>▼ Move Down</button>
    <button id="bUndo" class="o" disabled>⟲ Undo</button>
    <button id="bRedo" class="o" disabled>⟳ Redo</button>
    <button id="bDel" class="danger" disabled>Delete Selected</button>
    <button id="bBatch" class="o">Batch Set…</button>
    <input type="search" id="q" placeholder="Filter…" style="margin-left:8px;">
    <div style="flex: 1;"></div>
    <button id="bCsvChirp" class="csvbtn o" disabled>Export CSV</button>
    <button id="bSaveYsf" style="background: var(--succ);" disabled>Save as .Ysf (CPS Ready)</button>
  </div>

  <div id="wrap">
    <table>
      <thead><tr id="hr"></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="msg" id="msg"></div>

<script id="codec">

// ===== Struktura .Ysf fajla IC-980 Pro (20.096 B) =====
// CPS slot #1 počinje na offsetu 1440; sledeći slot je +76 B. UI indeks 0 odgovara CPS kanalu #1.
// Zaglavlje 1.440 B | 245 zapisa x 76 B (240 kanala + 5 sistemskih) | završni blok 36 B
const HEADER_SIZE = 1440, REC_SIZE = 76, MAX_CH = 240, RESERVED_CH = 5, TAIL_SIZE = 36;
const RESERVED_OFFSET = HEADER_SIZE + MAX_CH * REC_SIZE;
const TAIL_OFFSET = RESERVED_OFFSET + RESERVED_CH * REC_SIZE;
const TOTAL_FILE_SIZE = TAIL_OFFSET + TAIL_SIZE;          // 20096
// CPS channel-presence map: 240 bits, LSB-first, channel #1 = bit 0.
// It occupies bytes 40..69 of the final 76-byte system record. Bytes 70..75
// are not part of this map and must be preserved exactly.
const CHANNEL_MAP_OFFSET = 40, CHANNEL_MAP_BYTES = 30, CHANNEL_MAP_END = 69;
const LEGACY_CHANNEL_MAP_OFFSET = 42; // old editor layout: two bytes late + one-based bit numbering
// Pomeraji unutar zapisa channels:
const F_RX = 0, F_TX = 14;                // u32 LE, Hz
const F_RXT = 28, F_RXT_TYPE = 30;        // RX ton: value (u16 LE) + tip
const F_TXT = 41, F_TXT_TYPE = 43;        // TX ton: value (u16 LE) + tip
const F_MODE = 58, F_FLAGS = 60, F_NAME = 61, NAME_LEN = 15;

// DCS value = 0x2800 | šifra (oktalne cifre čitane kao broj, npr. 025 -> 0x15)
// Bajt 57: bitovi 3-4 = Busy Inhibit (0 OFF, 1 DQT, 2 CAT), bitovi 5-6 = Rx signal Code (0 OFF, 1 DTMF, 2 FSK, 3 FSK DTMF)
// Bajt 58: bit 7 = Scan (1 ADD, 0 DEL), bit 5 = TX Power (1 High, 0 Low), bit 4 = Bandwidth (1 Wide, 0 Narrow),
//          bitovi 1-3 = Special DCS (0 OFF, 1-3), bit 0 = Compandor (1 ON)
// Bajt 59: bitovi 0-3 = scramble (0 OFF, 1-8), bit 4 = Vague Subaudio (1 ON)

// Bajt 61 = PTT Push Code, bajt 62 = PTT Pop Code: 0 OFF, 1 ID, 2.. = Code form-1.. (n+1)

const TONE_TYPES = [

  114.8, 118.8, 123.0, 127.3, 131.8, 136.5, 141.3, 146.2, 151.4, 156.7, 159.8, 162.2, 165.5, 167.9,
  171.3, 173.8, 177.3, 179.9, 183.5, 186.2, 189.9, 192.8, 196.6, 199.5, 203.5, 206.5, 210.7, 218.1,
  225.7, 229.1, 233.6, 241.8, 250.3, 254.1

const DCS_LIST = ('023 025 026 031 032 036 043 047 051 053 054 065 071 072 073 074 114 115 116 122 125 131 132 134 ' +
  '143 145 152 155 156 162 165 172 174 205 212 223 225 226 243 244 245 246 251 252 255 261 263 265 266 271 274 ' +
  '306 311 315 325 331 332 343 346 351 356 364 365 371 411 412 413 423 431 432 445 446 452 454 455 462 464 465 ' +

function u32le(r, o) { return (r[o] | r[o+1] << 8 | r[o+2] << 16 | r[o+3] * 16777216) >>> 0; }

function decodeTone(rec, valOff, typeOff) {

function decodeYsf(buf) {

  // meaningful channel records; this lets old files be migrated on next save.
  const bitAt = (base, oneBased, k) => {

    const off = HEADER_SIZE + k * REC_SIZE;

}

function encodeTone(buf, off, valOff, typeOff, t) {
  buf[off + typeOff] = t.type;

  if (t.type === 0) v = t.noneRaw;

function encodeYsf(channels, rawHeader, rawTail, reservedRecords = rawReserved, channelTemplates = rawChannelTemplates) {
  const buf = new Uint8Array(TOTAL_FILE_SIZE);

  // Pro predloška. Za postojeće kanale njihov raw zapis ima prednost.
  for (let k = 0; k < MAX_CH; k++) {
    const ch = channels[k];
    const base = ch && ch.raw ? ch.raw : channelTemplates[k];

  // slot 1 -> bit 0 of byte 40; slot 240 -> bit 7 of byte 69.
  // Do not touch bytes 70..75 or any other system/template bytes.
  for (let i = 0; i < CHANNEL_MAP_BYTES; i++) buf[bitmapOffset + CHANNEL_MAP_OFFSET + i] = 0;
  for (let k = 0; k < Math.min(channels.length, MAX_CH); k++) {
    if (channels[k] && channels[k].rx > 0) {
      buf[bitmapOffset + CHANNEL_MAP_OFFSET + Math.floor(k / 8)] |= 1 << (k % 8);
    }
  }
  buf.set(rawTail.subarray(0, TAIL_SIZE), TAIL_OFFSET);

}


// ===== Pomoćne funkcije i model =====
const r6 = (x) => Math.round(x * 1e6) / 1e6;
const noTone = () => ({ type: 0, ctcss: 88.5, dcs: '023', noneRaw: 0xFFFF });

const newChannel = (name) => ({ name, rx: 0, tx: 0, am: 0, scan: 1, pwr: 1, bw: 1, sdcs: 0, comp: 0,
  busy: 0, rxsig: 0, scr: 0, vague: 0, push: 0, pop: 0, rxT: noTone(), txT: noTone(), ex: {} });

// Opcije za padajuće menije (value, tekst) - proverene u CPS-u 8118Plus
const OPT = {
  pwr: [[1, 'High'], [0, 'Low']],
  bw: [[1, 'Wide'], [0, 'Narrow']],
  scan: [[1, 'ADD'], [0, 'DEL']],
  busy: [[0, 'OFF'], [1, 'DQT'], [2, 'CAT']],
  sdcs: [[0, 'OFF'], [1, 'Special DCS 1'], [2, 'Special DCS 2'], [3, 'Special DCS 3']],
  onoff: [[0, 'OFF'], [1, 'ON']],
  scr: [[0, 'OFF']].concat(Array.from({ length: 8 }, (_, i) => [i + 1, 'scramble ' + (i + 1)])),
  mode: [[0, 'FM'], [1, 'AM']],
  rxsig: [[0, 'OFF'], [1, 'DTMF'], [2, 'FSK'], [3, 'FSK DTMF']],
  code: [[0, 'OFF'], [1, 'ID']].concat(Array.from({ length: 30 }, (_, i) => [i + 2, 'Code form-' + (i + 1)]))

// ako fajl sadrži value koje nema na listi, prikaži je kao "?" i save je netaknutu
function withCur(opts, cur) { return opts.some(o => o[0] === cur) ? opts : opts.concat([[cur, '? (' + cur + ')']]); }

function nearestCtcss(f) { return CTCSS_LIST.reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a); }

function parseCSVLine(line) {
  const out = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) { if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === ',') { out.push(cur); cur = ''; }
    else if (c === '"') inQ = true;

function sameTone(a, b) {

// ===== CHIRP / Radtel RT-920 CSV (21 kolona, CRLF, bez BOM-a - kao u priloženom fajlu) =====
const CHIRP_HEAD = ['Location','Name','Frequency','Duplex','Offset','Tone','rToneFreq','cToneFreq','DtcsCode','DtcsPolarity',

function dirOf(ch) { const d = r6(ch.tx - ch.rx); return { dir: d === 0 ? '' : (d > 0 ? '+' : '-'), off: Math.abs(d) }; }

// CHIRP polja tona -> tonovi channels (Dec = RX ton, Enc = TX ton)
function toneFromChirp(f) {

    const t = noTone();
    if (kind === 'Tone') { t.type = 1; t.ctcss = nearestCtcss(isTx ? rT : cT); }

  let tx = rx;
  if (dup === '-') tx = rx - off; else if (dup === '+') tx = rx + off; else if (dup.toLowerCase() === 'split') tx = off;
  if (!(tx > 0)) tx = rx;

    rxT: tn.rxT, txT: tn.txT });

  ch.ex = { TStep: g('TStep') || '5.00', Comment: g('Comment'), URCALL: g('URCALL'), RPT1CALL: g('RPT1CALL'), RPT2CALL: g('RPT2CALL'), DVCODE: g('DVCODE') };

}
function toChirpCsv(channels) {
  const lines = [CHIRP_HEAD.join(',')];
  channels.forEach((ch, i) => {
    const f = chirpFields(ch), ex = ch.ex || {};

      f.DtcsPolarity, f.RxDtcsCode, f.CrossMode, f.Mode, ex.TStep || '5.00', f.Skip, '8.0W',
      ex.Comment || '', ex.URCALL || '', ex.RPT1CALL || '', ex.RPT2CALL || '', ex.DVCODE || ''].map(csvCell).join(','));

// ===== CSV sa kolonama kao u CPS-u 8118Plus =====
const FULL_HEAD = ['NO.','RX Freq.','TX Freq.','QT/DQT Dec','QT/DQT Enc','TX Power','Bandwidth','Scan','Busy Inhibit','Special DCS',
  'Compandor','scramble','Name'];
const toneLabel = (t) => t.type === 0 ? 'Off' : (t.type === 1 ? t.ctcss.toFixed(1) : 'D' + t.dcs + (t.type === 3 ? 'I' : 'N'));

    optLabel('pwr', ch.pwr), optLabel('bw', ch.bw), optLabel('scan', ch.scan), optLabel('busy', ch.busy), optLabel('sdcs', ch.sdcs),

function captureTextSel(t) {

async function cutText(info) {

  const nv = info.value.slice(0, info.start) + info.value.slice(info.end);
  if ((t.type === 'number' || t.dataset.numeric === '1') && (nv === '' || isNaN(Number(nv.replace(',', '.'))))) { setMsg('Cannot cut: the field would be left empty or contain an invalid value.', 'err'); return; }

  const sl = captureTextSel(t); if (sl) { s = sl.start; e = sl.end; }

}
async function copyText(info) {

}
async function pasteText(info) {
  if (!info) return;
  const t = info.input; let txt = '';
  try { txt = await navigator.clipboard.readText(); } catch (e) { setMsg('Cannot read the clipboard - paste the text using Ctrl+V.', 'err'); return; }
  txt = txt.replace(/[\r\n]+/g, ' ').trim();
  if (!txt) { setMsg('The clipboard is empty.', 'err'); return; }
  if (!t.isConnected || t.value !== info.value) { setMsg('The field has changed in the meantime - try again.', 'err'); return; }
  const hasSel = info.start != null && info.end != null && info.end > info.start;
  let nv;
  if (info.number) {
    const n = txt.replace(',', '.');
    if (!/^-?\d+(\.\d+)?$/.test(n)) { setMsg('Cannot paste: this numeric field accepts numbers only.', 'err'); return; }
    nv = hasSel ? info.value.slice(0, info.start) + n + info.value.slice(info.end) : n;
    if (isNaN(parseFloat(nv))) { setMsg('Cannot paste: the result is not a valid number.', 'err'); return; }
  } else {
    const s = info.start == null ? info.value.length : info.start, e = info.end == null ? s : info.end;

function showBatch() {
  const a = selIdx(), pr = channels[a.length ? a[0] : primary];   // RX/TX se popunjavaju iz prvog selectedg channels (kao i Start Channel)

  f.scr = row(left, 'Scrambler', mkSel(batchScrOpts, pr ? pr.scr : 0, noop), 'scr');
